<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Indicadores urbanos del modelo RapOt</title>
  <desc id="desc">Infografía con cuatro indicadores: 28 hectáreas de territorio conectado, 3.4 kilómetros de ciudad caminable, 17 activos urbanos y 8 minutos de acceso cercano.</desc>
  <rect width="1600" height="1000" fill="#071b31"/>
  <path d="M0 120H1600M0 880H1600M110 0V1000M1490 0V1000" stroke="#7fb8df" stroke-opacity=".18"/>
  <path d="M0 260h1600M0 500h1600M0 740h1600" stroke="#7fb8df" stroke-opacity=".09" stroke-dasharray="6 14"/>
  <text x="110" y="105" fill="#9ed0ef" font-family="Montserrat,Arial,sans-serif" font-size="28" font-weight="600" letter-spacing="7">RapOt / NUEVO MODELO DE CIUDAD</text>
  <text x="110" y="205" fill="#f4f8fb" font-family="Montserrat,Arial,sans-serif" font-size="72" font-weight="700">Indicadores para construir</text>
  <text x="110" y="285" fill="#f4f8fb" font-family="Montserrat,Arial,sans-serif" font-size="72" font-weight="700">una ciudad mejor.</text>
  <text x="110" y="350" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="24">Una lectura inicial de los principios urbanos de RapOt.</text>
  <g transform="translate(110 440)">
    <rect width="320" height="300" fill="#0d3558" stroke="#58a8e5" stroke-width="2"/><text x="34" y="74" fill="#8ec7ef" font-family="Montserrat,Arial,sans-serif" font-size="64" font-weight="700">28 ha</text><text x="34" y="128" fill="#f4f8fb" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="700">TERRITORIO CONECTADO</text><text x="34" y="177" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">Un ámbito urbano para</text><text x="34" y="204" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">integrar oportunidades</text><text x="34" y="231" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">y bienestar.</text><circle cx="268" cy="246" r="24" fill="none" stroke="#58a8e5" stroke-width="2"/><circle cx="268" cy="246" r="6" fill="#58a8e5"/>
    <rect x="360" width="320" height="300" fill="#0d3558" stroke="#58a8e5" stroke-width="2"/><text x="394" y="74" fill="#8ec7ef" font-family="Montserrat,Arial,sans-serif" font-size="64" font-weight="700">3.4 km</text><text x="394" y="128" fill="#f4f8fb" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="700">CIUDAD CAMINABLE</text><text x="394" y="177" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">Distancias cotidianas</text><text x="394" y="204" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">más cortas y</text><text x="394" y="231" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">accesibles.</text><path d="M620 255l25-60 25 60z" fill="none" stroke="#58a8e5" stroke-width="2"/>
    <rect x="720" width="320" height="300" fill="#0d3558" stroke="#58a8e5" stroke-width="2"/><text x="754" y="74" fill="#8ec7ef" font-family="Montserrat,Arial,sans-serif" font-size="64" font-weight="700">17</text><text x="754" y="128" fill="#f4f8fb" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="700">ACTIVOS URBANOS</text><text x="754" y="177" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">Memorias, comunidades</text><text x="754" y="204" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">y espacios para</text><text x="754" y="231" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">activar.</text><path d="M980 255h35M997 237v36" stroke="#58a8e5" stroke-width="3"/>
    <rect x="1080" width="320" height="300" fill="#0d3558" stroke="#58a8e5" stroke-width="2"/><text x="1114" y="74" fill="#8ec7ef" font-family="Montserrat,Arial,sans-serif" font-size="64" font-weight="700">8 min</text><text x="1114" y="128" fill="#f4f8fb" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="700">ACCESO CERCANO</text><text x="1114" y="177" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">Servicios y oportunidades</text><text x="1114" y="204" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">al alcance de la</text><text x="1114" y="231" fill="#b9d5e8" font-family="Montserrat,Arial,sans-serif" font-size="17">vida diaria.</text><circle cx="1318" cy="246" r="25" fill="none" stroke="#58a8e5" stroke-width="2"/><path d="M1318 246l16-13M1318 246v-18" stroke="#58a8e5" stroke-width="2"/>
  </g>
  <text x="110" y="855" fill="#f4f8fb" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="600">RapOt conecta territorio, comunidad y futuro compartido.</text>
  <text x="110" y="910" fill="#7fb8df" font-family="Montserrat,Arial,sans-serif" font-size="17" letter-spacing="3">INDICADORES DE REFERENCIA · PROPUESTA INICIAL</text>
</svg>
